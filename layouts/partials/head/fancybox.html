{{- $hasImg := findRE `<img` .Content -}}
{{- $hasPDF := .HasShortcode "pdf" -}}

{{- if and .Site.Params.fancybox (or $hasImg $hasPDF) -}}
    {{ $styles := resources.Get "lib/fancybox/fancybox.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}" crossorigin="anonymous">

    {{ $js := resources.Get "lib/fancybox/fancybox.umd.js" | minify | fingerprint }}
    <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" crossorigin="anonymous"></script>

    {{- $add := resources.Get "lib/fancybox/addfancybox.js" | minify | fingerprint -}}
    <script src="{{ $add.RelPermalink }}" integrity="{{ $add.Data.Integrity }}" crossorigin="anonymous"></script>

    <script>
        // 定义全局初始化函数
        window.initFancybox = function() {
            if (typeof Fancybox !== "undefined") {
                // 1. 手动为解密后的图片添加 data-fancybox 属性
                // 这样可以确保即使 addfancybox.js 没运行，图片也能被灯箱识别
                const images = document.querySelectorAll('#encrypted-content img:not([data-fancybox])');
                images.forEach(img => {
                    img.setAttribute('data-fancybox', 'gallery');
                    img.style.cursor = 'zoom-in'; // 增加视觉反馈
                });

                // 2. 销毁旧绑定（如果有）并重新绑定
                Fancybox.bind("[data-fancybox]", {
                    // 这里可以添加你的全局配置
                });
            }
        };

        document.addEventListener("DOMContentLoaded", window.initFancybox);
    </script>
{{ end }}
